<style>
/* ========== CSS Variables - 极简纯白ins风 ========== */
:root {
  --bg-primary: #F9F9F9;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F5F5F5;
  --text-primary: #1A1A1A;
  --text-secondary: #6B6B6B;
  --text-muted: #B0B0B0;
  --text-inverse: #FFFFFF;

  --accent-blue: #3B82F6;
  --accent-blue-light: #EFF6FF;
  --accent-blue-dark: #2563EB;
  --accent-purple: #8B5CF6;
  --accent-purple-light: #F5F3FF;
  --accent-green: #10B981;
  --accent-green-light: #ECFDF5;
  --accent-green-dark: #059669;
  --accent-pink: #EC4899;
  --accent-pink-light: #FDF2F8;
  --accent-pink-dark: #DB2777;
  --accent-coral: #F97316;
  --accent-coral-light: #FFF7ED;
  --accent-warm: #1A1A1A;
  --accent-warm-light: #F5F5F5;
  --accent-yellow: #F59E0B;
  --accent-yellow-light: #FFFBEB;

  --border: #EBEBEB;
  --border-light: #F5F5F5;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.06);
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-xl: 24px;

  --sidebar-width: 72px;
  --bottom-nav-height: 64px;
  --header-height: 52px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

/* ========== Reset ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.5;
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit;border:none;outline:none;background:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
ul,ol{list-style:none}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* ========== App Layout ========== */
.app-container{
  display:flex;
  min-height:100vh;
  min-height:100dvh;
  padding-left:var(--sidebar-width);
  padding-bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
}

/* ========== Sidebar ========== */
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:var(--sidebar-width);
  background:var(--bg-card);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 0;
  z-index:100;
  box-shadow:var(--shadow-sm);
  overflow-y:auto;
}
.sidebar-logo{
  width:44px;height:44px;
  border-radius:50%;
  background:var(--text-primary);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  font-size:18px;
  font-weight:700;
  margin-bottom:20px;
  flex-shrink:0;
}
.sidebar-items{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  flex:1;
  width:100%;
  padding:0 8px;
}
.sidebar-item{
  width:56px;height:56px;
  border-radius:var(--radius);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  color:var(--text-secondary);
  transition:var(--transition);
  position:relative;
  cursor:pointer;
  user-select:none;
}
.sidebar-item .si-icon{font-size:20px;transition:var(--transition)}
.sidebar-item .si-label{font-size:10px;font-weight:500;transition:var(--transition)}
.sidebar-item:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.sidebar-item.active{color:var(--text-inverse);font-weight:600}
.sidebar-item.active .si-icon{transform:scale(1.1)}
.sidebar-item[data-section="学习"]{--item-color:var(--accent-blue);--item-light:var(--accent-blue-light)}
.sidebar-item[data-section="学习"].active{background:var(--accent-blue);box-shadow:0 3px 10px rgba(59,130,246,0.25)}
.sidebar-item[data-section="工作"]{--item-color:var(--accent-purple);--item-light:var(--accent-purple-light)}
.sidebar-item[data-section="工作"].active{background:var(--accent-purple);box-shadow:0 3px 10px rgba(139,92,246,0.25)}
.sidebar-item[data-section="生活"]{--item-color:var(--accent-green);--item-light:var(--accent-green-light)}
.sidebar-item[data-section="生活"].active{background:var(--accent-green);box-shadow:0 3px 10px rgba(16,185,129,0.25)}
.sidebar-item[data-section="情绪"]{--item-color:var(--accent-pink);--item-light:var(--accent-pink-light)}
.sidebar-item[data-section="情绪"].active{background:var(--accent-pink);box-shadow:0 3px 10px rgba(236,72,153,0.25)}
.sidebar-item[data-section="月经"]{--item-color:var(--accent-coral);--item-light:var(--accent-coral-light)}
.sidebar-item[data-section="月经"].active{background:var(--accent-coral);box-shadow:0 3px 10px rgba(249,115,22,0.25)}
.sidebar-divider{width:32px;height:1px;background:var(--border);margin:4px 0}
.sidebar-add{
  width:44px;height:44px;
  border-radius:50%;
  border:1.5px dashed var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
  font-size:20px;
  transition:var(--transition);
  flex-shrink:0;
  margin-top:4px;
}
.sidebar-add:hover{border-color:var(--text-primary);color:var(--text-primary);background:var(--accent-warm-light)}

/* ========== Main Content ========== */
.main-content{
  flex:1;
  min-width:0;
  padding:16px;
  max-width:600px;
  margin:0 auto;
  width:100%;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 0 16px;
}
.header-date{font-size:13px;color:var(--text-secondary)}
.header-title{font-size:22px;font-weight:700;letter-spacing:-0.3px}

/* ========== Section Visibility ========== */
.section{display:none;animation:fadeSlideIn 0.3s ease}
.section.active{display:block}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ========== Dashboard Stats ========== */
.stats-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}
.stat-card{
  background:var(--bg-card);
  border-radius:var(--radius);
  padding:14px 10px;
  text-align:center;
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
  cursor:default;
}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.stat-card .stat-num{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
.stat-card .stat-label{font-size:11px;color:var(--text-secondary);margin-top:5px}
.stat-todo .stat-num{color:var(--text-primary)}
.stat-done .stat-num{color:var(--accent-green)}
.stat-undone .stat-num{color:var(--accent-pink)}
.stat-rate .stat-num{color:var(--accent-blue)}

/* ========== Cards ========== */
.card{
  background:var(--bg-card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow-sm);
  margin-bottom:14px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.card-title{
  font-size:16px;
  font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.card-title .ct-icon{font-size:18px}
.card-badge{
  font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:20px;
}
.inbox-card{border-left:3px solid var(--text-primary)}
.inbox-card .card-badge{background:var(--accent-warm-light);color:var(--text-secondary)}
.inbox-count{font-size:28px;font-weight:700;color:var(--text-primary)}
.inbox-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.inbox-empty{color:var(--text-muted);font-size:14px;text-align:center;padding:12px 0}

/* ========== Daily Todos ========== */
.todo-input-row{display:flex;gap:8px;margin-bottom:12px}
.todo-input{
  flex:1;
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
  transition:var(--transition);
}
.todo-input:focus{border-color:var(--text-primary);background:var(--bg-card)}
.todo-add-btn{
  padding:10px 16px;
  background:var(--text-primary);
  color:#fff;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  transition:var(--transition);
  white-space:nowrap;
}
.todo-add-btn:hover{opacity:0.9}
.todo-add-btn:active{transform:scale(0.96)}
.todo-list{display:flex;flex-direction:column;gap:6px}
.todo-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--bg-primary);
  border-radius:var(--radius-sm);
  transition:var(--transition);
}
.todo-item:hover{background:#F5F5F5}
.todo-check{
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid var(--border);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
  cursor:pointer;
  font-size:10px;
  color:transparent;
}
.todo-item.done .todo-check{
  border-color:var(--accent-green);
  background:var(--accent-green);
  color:#fff;
}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-muted)}
.todo-text{flex:1;font-size:14px;transition:var(--transition)}
.todo-del{
  color:var(--text-muted);
  font-size:16px;
  padding:2px 6px;
  border-radius:6px;
  transition:var(--transition);
  opacity:0;
}
.todo-item:hover .todo-del{opacity:1}
.todo-del:hover{color:var(--accent-pink);background:var(--accent-pink-light)}
.todo-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:16px 0}

/* ========== Inbox Modal ========== */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(4px);
  z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{
  background:var(--bg-card);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  width:100%;max-width:500px;
  max-height:70vh;
  overflow-y:auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{
  width:36px;height:4px;
  background:var(--border);
  border-radius:2px;
  margin:0 auto 16px;
}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px}
.modal-input{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  font-size:14px;
  background:var(--bg-primary);
  resize:none;
  min-height:80px;
  margin-bottom:12px;
}
.modal-input:focus{border-color:var(--text-primary)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn{
  padding:10px 20px;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  transition:var(--transition);
}
.btn-primary{background:var(--text-primary);color:#fff}
.btn-primary:hover{opacity:0.9}
.btn-secondary{background:var(--bg-primary);color:var(--text-secondary)}
.btn-secondary:hover{background:var(--border)}
.inbox-list{display:flex;flex-direction:column;gap:8px}
.inbox-item{
  padding:12px 14px;
  background:var(--bg-primary);
  border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:10px;
  font-size:14px;
}
.inbox-item .inbox-dot{width:8px;height:8px;border-radius:50%;background:var(--text-primary);flex-shrink:0}
.inbox-item .inbox-text{flex:1}
.inbox-item .inbox-actions{display:flex;gap:6px;flex-shrink:0}
.inbox-item .ia-btn{
  font-size:12px;
  padding:4px 10px;
  border-radius:12px;
  font-weight:500;
  transition:var(--transition);
}
.ia-process{background:var(--accent-green-light);color:var(--accent-green-dark)}
.ia-process:hover{background:var(--accent-green);color:#fff}
.ia-archive{background:var(--accent-warm-light);color:var(--text-secondary)}
.ia-archive:hover{background:var(--text-primary);color:#fff}

/* ========== FAB ========== */
.fab{
  position:fixed;
  right:16px;
  bottom:calc(var(--bottom-nav-height) + 24px + env(safe-area-inset-bottom, 0px));
  width:52px;height:52px;
  border-radius:50%;
  background:var(--text-primary);
  color:#fff;
  font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
  z-index:90;
  transition:var(--transition);
}
.fab:hover{transform:scale(1.05)}
.fab:active{transform:scale(0.95)}

/* ========== Bottom Nav ========== */
.bottom-nav{
  position:fixed;
  bottom:0;left:var(--sidebar-width);right:0;
  height:var(--bottom-nav-height);
  background:var(--bg-card);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 8px;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  z-index:100;
  box-shadow:0 -1px 6px rgba(0,0,0,0.04);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 10px;
  border-radius:var(--radius-sm);
  transition:var(--transition);
  color:var(--text-muted);
  font-size:10px;
  font-weight:500;
  min-width:52px;
  cursor:pointer;
  user-select:none;
}
.nav-item .ni-icon{font-size:20px;transition:var(--transition)}
.nav-item:hover{color:var(--text-secondary)}
.nav-item.active{font-weight:600}
.nav-item.active .ni-icon{transform:translateY(-2px)}
.nav-item[data-nav="dashboard"].active{color:var(--text-primary)}
.nav-item[data-nav="todos"].active{color:var(--text-primary)}
.nav-item[data-nav="study"].active{color:var(--accent-blue)}
.nav-item[data-nav="life"].active{color:var(--accent-green)}
.nav-item[data-nav="mood"].active{color:var(--accent-pink)}

/* ========== Study Section ========== */
.study-task{
  background:var(--accent-blue-light);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  border-left:3px solid var(--accent-blue);
}
.study-task .st-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.study-task .st-title{font-size:15px;font-weight:600;color:var(--accent-blue-dark)}
.study-task .st-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.study-task .st-check input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent-blue)}
.study-review{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--accent-blue);
}
.study-review textarea{
  width:100%;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.6);
  border:1px solid transparent;
  font-size:13px;
  resize:none;
  min-height:50px;
  color:var(--text-primary);
}
.study-review textarea:focus{border-color:var(--accent-blue);background:#fff}
.study-review .sr-label{font-size:11px;color:var(--accent-blue-dark);margin-bottom:6px;font-weight:500}
.edit-task-btn{
  font-size:11px;color:var(--accent-blue);
  padding:3px 8px;border-radius:8px;
  transition:var(--transition);
}
.edit-task-btn:hover{background:rgba(255,255,255,0.6)}
.add-study-task{
  width:100%;
  padding:12px;
  border:1.5px dashed var(--accent-blue);
  border-radius:var(--radius);
  text-align:center;
  color:var(--accent-blue);
  font-size:14px;
  transition:var(--transition);
}
.add-study-task:hover{background:var(--accent-blue-light)}

/* ========== Work Section ========== */
.work-placeholder{
  text-align:center;
  padding:40px 20px;
  color:var(--text-muted);
}
.work-placeholder .wp-icon{font-size:48px;margin-bottom:12px;opacity:0.5}

/* ========== Life Section ========== */
.life-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}
.life-form .lf-group{display:flex;flex-direction:column;gap:4px}
.life-form .lf-group.full{grid-column:1/-1}
.life-form label{font-size:12px;font-weight:500;color:var(--text-secondary)}
.life-form input,.life-form textarea{
  padding:10px 12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
  transition:var(--transition);
}
.life-form input:focus,.life-form textarea:focus{border-color:var(--accent-green);background:var(--bg-card)}
.life-form textarea{resize:none;min-height:40px}
.life-submit{
  grid-column:1/-1;
  padding:11px;
  background:var(--accent-green);
  color:#fff;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  transition:var(--transition);
}
.life-submit:hover{opacity:0.9}
.life-submit:active{transform:scale(0.97)}
#lfExerciseList label:has(input:checked){background:var(--accent-green-light);color:var(--accent-green-dark)}
#lfExerciseList input[type="checkbox"]{accent-color:var(--accent-green)}
.chart-tabs{display:flex;gap:6px;margin-bottom:12px}
.chart-tab{
  padding:6px 14px;
  border-radius:16px;
  font-size:12px;
  font-weight:500;
  background:var(--bg-primary);
  color:var(--text-secondary);
  transition:var(--transition);
}
.chart-tab.active{background:var(--text-primary);color:#fff}
.chart-container{position:relative;height:200px;margin-bottom:12px}
.recommendation{
  background:var(--accent-green-light);
  border-radius:var(--radius);
  padding:14px 16px;
  border-left:3px solid var(--accent-green);
  font-size:13px;
  line-height:1.7;
  color:var(--accent-green-dark);
}
.recommendation .rec-title{font-size:14px;font-weight:600;margin-bottom:6px}

/* ========== Mood Section ========== */
.mood-slider-container{
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;
}
.mood-emoji{font-size:32px;transition:var(--transition)}
.mood-slider{
  flex:1;
  -webkit-appearance:none;
  height:6px;
  border-radius:3px;
  background:linear-gradient(to right,var(--accent-pink-light),var(--accent-pink),var(--accent-pink-dark));
  outline:none;
}
.mood-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:28px;height:28px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--accent-pink);
  box-shadow:var(--shadow-sm);
  cursor:pointer;
}
.mood-value{font-size:24px;font-weight:700;color:var(--accent-pink);min-width:32px;text-align:center}
.mood-label{text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:10px}
.mood-note{
  width:100%;
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
  resize:none;
  min-height:50px;
  margin-bottom:10px;
}
.mood-note:focus{border-color:var(--accent-pink);background:var(--bg-card)}
.mood-submit{
  width:100%;
  padding:11px;
  background:var(--accent-pink);
  color:#fff;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  margin-bottom:16px;
  transition:var(--transition);
}
.mood-submit:hover{opacity:0.9}
.mood-submit:active{transform:scale(0.97)}
.mood-tips{
  background:var(--accent-pink-light);
  border-radius:var(--radius);
  padding:14px 16px;
  border-left:3px solid var(--accent-pink);
  font-size:13px;
  line-height:1.7;
  color:var(--accent-pink-dark);
}
.mood-tips .mt-title{font-size:14px;font-weight:600;margin-bottom:6px}

/* ========== Period Section ========== */
.period-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}
.period-form .pf-group{display:flex;flex-direction:column;gap:4px}
.period-form .pf-group.full{grid-column:1/-1}
.period-form label{font-size:12px;font-weight:500;color:var(--text-secondary)}
.period-form input,.period-form select{
  padding:10px 12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
}
.period-form input:focus,.period-form select:focus{border-color:var(--accent-coral);background:var(--bg-card)}
.period-checkboxes{
  display:flex;flex-wrap:wrap;gap:8px;
}
.period-checkboxes label{
  display:flex;align-items:center;gap:4px;
  font-size:13px;cursor:pointer;
  padding:6px 12px;
  border-radius:16px;
  background:var(--bg-primary);
  transition:var(--transition);
}
.period-checkboxes label:has(input:checked){background:var(--accent-coral-light);color:var(--accent-coral)}
.period-checkboxes input[type="checkbox"]{accent-color:var(--accent-coral)}
.period-submit{
  grid-column:1/-1;
  padding:11px;
  background:var(--accent-coral);
  color:#fff;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  transition:var(--transition);
}
.period-submit:hover{opacity:0.9}
.period-submit:active{transform:scale(0.97)}
.period-history{display:flex;flex-direction:column;gap:8px}
.period-record{
  background:var(--accent-coral-light);
  border-radius:var(--radius);
  padding:14px 16px;
  border-left:3px solid var(--accent-coral);
}
.period-record .pr-dates{font-size:14px;font-weight:600;margin-bottom:6px}
.period-record .pr-details{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-secondary)}
.period-record .pr-tag{
  padding:2px 8px;
  border-radius:10px;
  background:rgba(255,255,255,0.6);
}
.period-record .pr-del{
  font-size:12px;color:var(--text-muted);
  float:right;
  cursor:pointer;
  transition:var(--transition);
}
.period-record .pr-del:hover{color:var(--accent-pink)}
.period-empty{text-align:center;color:var(--text-muted);font-size:14px;padding:24px 0}

/* ========== Toast ========== */
.toast{
  position:fixed;
  top:20px;left:50%;
  transform:translateX(-50%);
  background:var(--text-primary);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  font-weight:500;
  z-index:300;
  animation:toastIn 0.3s ease,toastOut 0.3s ease 2s forwards;
  pointer-events:none;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* ========== Modal for Add Sidebar Item ========== */
.modal-sidebar .modal-input{margin-bottom:16px}
.modal-sidebar .color-picker{display:flex;gap:8px;margin-bottom:16px}
.color-dot{
  width:28px;height:28px;border-radius:50%;
  cursor:pointer;transition:var(--transition);
  border:2px solid transparent;
}
.color-dot.selected{border-color:var(--text-primary);transform:scale(1.15)}
.color-dot:hover{transform:scale(1.1)}

/* ========== Edit Task Modal ========== */
/* iOS touch optimization */
button,.nav-item,.sidebar-item,.fab,.todo-check,.todo-del,.card-badge,.stat-card,.chart-tab,.edit-task-btn,.ia-btn,.pr-del{touch-action:manipulation}

/* ========== Responsive ========== */
@media(min-width:768px){
  .main-content{max-width:640px;padding:24px}
  .stats-row{gap:12px}
}
@media(max-width:380px){
  :root{--sidebar-width:56px}
  .sidebar-item{width:44px;height:48px;font-size:9px}
  .sidebar-item .si-icon{font-size:17px}
  .stats-row{gap:6px}
  .stat-card{padding:10px 6px}
  .stat-card .stat-num{font-size:20px}
}
</style>
</head>
<body>

<div class="app-container">
  <!-- ===== Sidebar ===== -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">P</div>
    <div class="sidebar-items" id="sidebarItems">
      <!-- dynamically rendered -->
    </div>
    <div class="sidebar-divider"></div>
    <button class="sidebar-add" id="sidebarAddBtn" title="添加分类">+</button>
  </nav>

  <!-- ===== Main Content ===== -->
  <main class="main-content" id="mainContent">
    <div class="header">
      <div>
        <div class="header-date" id="headerDate"></div>
        <div class="header-title">PersonalOS</div>
      </div>
    </div>

    <!-- Dashboard -->
    <section class="section active" id="section-dashboard">
      <div class="stats-row" id="statsRow"></div>

      <div class="card inbox-card" id="inboxCard" onclick="openInbox()">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📥</span>收件箱</span>
          <span class="card-badge">未整理</span>
        </div>
        <div class="inbox-count" id="inboxCount">0</div>
        <div class="inbox-sub">条未处理记录</div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📋</span>当日待办</span>
          <span class="card-badge" style="background:var(--accent-warm-light);color:var(--text-secondary)">临时琐事</span>
        </div>
        <div class="todo-input-row">
          <input class="todo-input" id="todoInput" placeholder="添加临时待办..." onkeydown="if(event.key==='Enter')addDailyTodo()">
          <button class="todo-add-btn" onclick="addDailyTodo()">添加</button>
        </div>
        <div class="todo-list" id="todoList"></div>
      </div>
    </section>

    <!-- Study -->
    <section class="section" id="section-study">
      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">📚</span>每日学习任务</span>
        <div id="studyTasks"></div>
        <button class="add-study-task" onclick="showAddStudyTask()">+ 添加学习任务</button>
      </div>
    </section>

    <!-- Work -->
    <section class="section" id="section-work">
      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">💼</span>工作台</span>
        <div id="workTasks"></div>
        <button class="add-study-task" style="border-color:var(--accent-purple);color:var(--accent-purple)" onclick="showAddWorkTask()">+ 添加工作任务</button>
      </div>
    </section>

    <!-- Life -->
    <section class="section" id="section-life">
      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">🏃</span>今日健康数据</span>
        <form class="life-form" id="lifeForm" onsubmit="saveLifeData(event)">
          <div class="lf-group">
            <label>体重 (kg)</label>
            <input type="number" step="0.1" id="lfWeight" placeholder="55.0" required>
          </div>
          <div class="lf-group">
            <label>步数</label>
            <input type="number" id="lfSteps" placeholder="8000" required>
          </div>
          <div class="lf-group">
            <label>卡路里消耗 (kcal)</label>
            <input type="number" id="lfCalories" placeholder="1800" required>
          </div>
          <div class="lf-group full">
            <label>锻炼项目</label>
            <div class="period-checkboxes" id="lfExerciseList">
              <label><input type="checkbox" class="exercise-checkbox" value="跑步"> 跑步</label>
              <label><input type="checkbox" class="exercise-checkbox" value="快走"> 快走</label>
              <label><input type="checkbox" class="exercise-checkbox" value="瑜伽"> 瑜伽</label>
              <label><input type="checkbox" class="exercise-checkbox" value="游泳"> 游泳</label>
              <label><input type="checkbox" class="exercise-checkbox" value="骑行"> 骑行</label>
              <label><input type="checkbox" class="exercise-checkbox" value="跳绳"> 跳绳</label>
              <label><input type="checkbox" class="exercise-checkbox" value="HIIT"> HIIT</label>
              <label><input type="checkbox" class="exercise-checkbox" value="力量训练"> 力量训练</label>
              <label><input type="checkbox" class="exercise-checkbox" value="拉伸"> 拉伸</label>
              <label><input type="checkbox" class="exercise-checkbox" value="羽毛球"> 羽毛球</label>
              <label><input type="checkbox" class="exercise-checkbox" value="篮球"> 篮球</label>
              <label><input type="checkbox" class="exercise-checkbox" value="舞蹈"> 舞蹈</label>
            </div>
          </div>
          <button type="submit" class="life-submit">保存数据</button>
        </form>
      </div>

      <div class="card" id="recommendationCard" style="display:none">
        <div class="recommendation" id="recommendationContent"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📋</span>历史记录</span>
        </div>
        <div class="period-history" id="lifeHistory"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📊</span>数据图表</span>
        </div>
        <div class="chart-tabs" id="lifeChartTabs">
          <button class="chart-tab active" data-period="week">周</button>
          <button class="chart-tab" data-period="month">月</button>
          <button class="chart-tab" data-period="year">年</button>
        </div>
        <div class="chart-container"><canvas id="stepsChart"></canvas></div>
        <div class="chart-container"><canvas id="caloriesChart"></canvas></div>
      </div>
    </section>

    <!-- Mood -->
    <section class="section" id="section-mood">
      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">💜</span>今日情绪记录</span>
        <div class="mood-slider-container">
          <span class="mood-emoji" id="moodEmoji">😐</span>
          <input type="range" class="mood-slider" id="moodSlider" min="1" max="10" value="5" oninput="updateMoodDisplay()">
          <span class="mood-value" id="moodValue">5</span>
        </div>
        <div class="mood-label" id="moodLabelText">平静</div>
        <textarea class="mood-note" id="moodNote" placeholder="今天想记录点什么..."></textarea>
        <button class="mood-submit" onclick="saveMood()">记录情绪</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📈</span>情绪趋势</span>
        </div>
        <div class="chart-tabs" id="moodChartTabs">
          <button class="chart-tab active" data-period="week">周</button>
          <button class="chart-tab" data-period="month">月</button>
          <button class="chart-tab" data-period="year">年</button>
        </div>
        <div class="chart-container"><canvas id="moodChart"></canvas></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span class="ct-icon">📝</span>历史记录</span>
        </div>
        <div class="period-history" id="moodHistory"></div>
      </div>

      <div class="card">
        <div class="mood-tips" id="moodTips">
          <div class="mt-title">💡 情绪调节小妙招</div>
          <div id="moodTipsContent"></div>
        </div>
      </div>
    </section>

    <!-- Period -->
    <section class="section" id="section-period">
      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">🌸</span>经期记录</span>
        <form class="period-form" id="periodForm" onsubmit="savePeriod(event)">
          <div class="pf-group">
            <label>开始日期</label>
            <input type="date" id="pfStart" required>
          </div>
          <div class="pf-group">
            <label>结束日期</label>
            <input type="date" id="pfEnd" required>
          </div>
          <div class="pf-group full">
            <label>症状</label>
            <div class="period-checkboxes">
              <label><input type="checkbox" id="pfPain"> 疼痛</label>
              <label><input type="checkbox" id="pfVomit"> 呕吐</label>
              <label><input type="checkbox" id="pfDiarrhea"> 拉肚子</label>
            </div>
          </div>
          <div class="pf-group">
            <label>前期血量</label>
            <select id="pfFlowEarly">
              <option value="少量">少量</option>
              <option value="中等" selected>中等</option>
              <option value="大量">大量</option>
            </select>
          </div>
          <div class="pf-group">
            <label>后期血量</label>
            <select id="pfFlowLate">
              <option value="少量">少量</option>
              <option value="中等" selected>中等</option>
              <option value="大量">大量</option>
            </select>
          </div>
          <button type="submit" class="period-submit">保存记录</button>
        </form>
      </div>

      <div class="card">
        <span class="card-title" style="margin-bottom:14px"><span class="ct-icon">📋</span>历史记录</span>
        <div class="period-history" id="periodHistory"></div>
      </div>
    </section>
  </main>

  <!-- ===== FAB ===== -->
  <button class="fab" id="fabBtn" onclick="openQuickRecord()" title="快速记录">+</button>

  <!-- ===== Bottom Nav ===== -->
  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item active" data-nav="dashboard" onclick="navigateTo('dashboard')">
      <span class="ni-icon">🏠</span><span>首页</span>
    </div>
    <div class="nav-item" data-nav="todos" onclick="navigateTo('todos')">
      <span class="ni-icon">📋</span><span>待办</span>
    </div>
    <div class="nav-item" data-nav="study" onclick="navigateTo('study')">
      <span class="ni-icon">📚</span><span>学习</span>
    </div>
    <div class="nav-item" data-nav="life" onclick="navigateTo('life')">
      <span class="ni-icon">🏃</span><span>生活</span>
    </div>
    <div class="nav-item" data-nav="mood" onclick="navigateTo('mood')">
      <span class="ni-icon">💜</span><span>情绪</span>
    </div>
  </nav>
</div>

<!-- ===== Inbox Modal ===== -->
<div class="modal-overlay" id="inboxModal" style="display:none" onclick="if(event.target===this)closeInbox()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">📥 收件箱 - 未处理记录</div>
    <div class="inbox-list" id="inboxList"></div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-secondary" onclick="closeInbox()">关闭</button>
    </div>
  </div>
</div>

<!-- ===== Quick Record Modal ===== -->
<div class="modal-overlay" id="quickRecordModal" style="display:none" onclick="if(event.target===this)closeQuickRecord()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">⚡ 快速记录</div>
    <textarea class="modal-input" id="quickRecordInput" placeholder="记录想法、灵感或待办..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeQuickRecord()">取消</button>
      <button class="btn btn-primary" onclick="saveQuickRecord()">保存到收件箱</button>
    </div>
  </div>
</div>

<!-- ===== Add Sidebar Modal ===== -->
<div class="modal-overlay modal-sidebar" id="addSidebarModal" style="display:none" onclick="if(event.target===this)closeAddSidebar()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">➕ 添加分类</div>
    <input class="modal-input" id="newSidebarName" placeholder="分类名称" maxlength="6">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAddSidebar()">取消</button>
      <button class="btn btn-primary" onclick="addSidebarItem()">添加</button>
    </div>
  </div>
</div>

<!-- ===== Edit Task Modal ===== -->
<div class="modal-overlay" id="editTaskModal" style="display:none" onclick="if(event.target===this)closeEditTask()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 编辑任务</div>
    <input class="modal-input" id="editTaskInput" placeholder="任务名称">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="deleteEditTask()" style="color:var(--accent-pink);margin-right:auto">删除</button>
      <button class="btn btn-secondary" onclick="closeEditTask()">取消</button>
      <button class="btn btn-primary" onclick="saveEditTask()">保存</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA LAYER ====================
const TODAY = new Date().toISOString().split('T')[0];
const DEFAULT_SIDEBAR = ['学习','工作','生活','情绪','月经'];
const DEFAULT_STUDY_TASKS = [
  {id:'s1',title:'单词复习',category:'学习',completed:false,review:'',editable:true},
  {id:'s2',title:'每日好句推荐',category:'学习',completed:false,review:'',editable:true},
  {id:'s3',title:'论文写作方法学习',category:'学习',completed:false,review:'',editable:true}
];

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let sidebarItems = load('pOS_sidebar',DEFAULT_SIDEBAR);
let tasks = load('pOS_tasks',DEFAULT_STUDY_TASKS);
let dailyTodos = load('pOS_dailyTodos',[]);
let lifeData = load('pOS_lifeData',{});
let moodData = load('pOS_moodData',{});
let periodData = load('pOS_periodData',[]);
let inbox = load('pOS_inbox',[]);

// Clean dailyTodos to today
dailyTodos = dailyTodos.filter(t=>t.date===TODAY);

let currentSection = 'dashboard';
let editTaskId = null;
let editingMoodDate = null;
let currentEditDate = TODAY;
let editPeriodId = null;
let stepsChart=null,caloriesChart=null,moodChart=null;

// ==================== HELPERS ====================
function uuid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}
function formatDate(d){const dt=new Date(d);return `${dt.getMonth()+1}/${dt.getDate()}`}

// ==================== INIT ====================
document.getElementById('headerDate').textContent=
  new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

renderSidebar();
renderDashboard();
renderStudyTasks();
renderWorkTasks();
renderDailyTodos();
renderPeriodHistory();
updateMoodDisplay();
loadLifeForm();
refreshMoodTips();
renderMoodHistory();
renderLifeHistory();
initChartTabs();

// ==================== SIDEBAR ====================
function renderSidebar(){
  const container=document.getElementById('sidebarItems');
  container.innerHTML=sidebarItems.map(s=>{
    const emoji=getSectionEmoji(s);
    const cls=s===currentSection?'active':'';
    return `<div class="sidebar-item ${cls}" data-section="${s}" onclick="selectSection('${s}')">
      <span class="si-icon">${emoji}</span><span class="si-label">${s}</span></div>`;
  }).join('');
}
function getSectionEmoji(s){
  const m={'学习':'📚','工作':'💼','生活':'🏃','情绪':'💜','月经':'🌸'};
  return m[s]||'📌';
}

document.getElementById('sidebarAddBtn').onclick=()=>{
  document.getElementById('addSidebarModal').style.display='flex';
  document.getElementById('newSidebarName').value='';
};
function closeAddSidebar(){document.getElementById('addSidebarModal').style.display='none'}
function addSidebarItem(){
  const name=document.getElementById('newSidebarName').value.trim();
  if(!name)return toast('请输入分类名称');
  if(sidebarItems.includes(name))return toast('该分类已存在');
  sidebarItems.push(name);
  save('pOS_sidebar',sidebarItems);
  renderSidebar();
  closeAddSidebar();
  toast(`已添加分类：${name}`);
}

function selectSection(section){
  currentSection=section;
  // Update sidebar
  document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.toggle('active',el.dataset.section===section));
  // Update bottom nav
  const navMap={'学习':'study','工作':'work','生活':'life','情绪':'mood','月经':'period'};
  const navKey=navMap[section]||'dashboard';
  updateBottomNav(navKey);
  // Show section
  showSection(navKey);
}

function showSection(key){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  const sectionMap={dashboard:'section-dashboard',todos:'section-dashboard',study:'section-study',work:'section-work',life:'section-life',mood:'section-mood',period:'section-period'};
  const secId=sectionMap[key];
  if(secId){
    const sec=document.getElementById(secId);
    if(sec)sec.classList.add('active');
  }
  if(key==='todos'){
    document.getElementById('todoInput').focus();
  }
  if(key==='life'){renderLifeCharts('week')}
  if(key==='mood'){renderMoodChart('week')}
}

// ==================== BOTTOM NAV ====================
function navigateTo(key){
  currentSection=key;
  updateBottomNav(key);
  showSection(key);
  // Sync sidebar
  const sidebarMap={dashboard:null,todos:null,study:'学习',work:'工作',life:'生活',mood:'情绪',period:'月经'};
  const sec=sidebarMap[key];
  document.querySelectorAll('.sidebar-item').forEach(el=>{
    el.classList.toggle('active',sec?el.dataset.section===sec:false);
  });
}
function updateBottomNav(key){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===key));
}

// ==================== DASHBOARD ====================
function renderDashboard(){
  const total=tasks.length;
  const done=tasks.filter(t=>t.completed).length;
  const undone=total-done;
  const rate=total>0?Math.round((done/total)*100):0;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card stat-todo"><div class="stat-num">${total}</div><div class="stat-label">待办</div></div>
    <div class="stat-card stat-done"><div class="stat-num">${done}</div><div class="stat-label">已完成</div></div>
    <div class="stat-card stat-undone"><div class="stat-num">${undone}</div><div class="stat-label">未完成</div></div>
    <div class="stat-card stat-rate"><div class="stat-num">${rate}%</div><div class="stat-label">完成率</div></div>
  `;
  const unprocessed=inbox.filter(i=>!i.processed).length;
  document.getElementById('inboxCount').textContent=unprocessed;
}

// ==================== DAILY TODOS ====================
function renderDailyTodos(){
  const list=document.getElementById('todoList');
  if(dailyTodos.length===0){
    list.innerHTML='<div class="todo-empty">暂无待办，记录今天的琐事吧 ✨</div>';
  }else{
    list.innerHTML=dailyTodos.map(t=>`
      <div class="todo-item ${t.done?'done':''}" id="todo-${t.id}">
        <div class="todo-check" onclick="toggleDailyTodo('${t.id}')">✓</div>
        <span class="todo-text">${escapeHtml(t.text)}</span>
        <button class="todo-del" onclick="deleteDailyTodo('${t.id}')">×</button>
      </div>
    `).join('');
  }
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function addDailyTodo(){
  const input=document.getElementById('todoInput');
  const text=input.value.trim();
  if(!text)return;
  dailyTodos.push({id:uuid(),date:TODAY,text,done:false,createdAt:new Date().toISOString()});
  save('pOS_dailyTodos',dailyTodos);
  input.value='';
  renderDailyTodos();
  toast('待办已添加');
}
function toggleDailyTodo(id){
  const t=dailyTodos.find(t=>t.id===id);
  if(t){t.done=!t.done;save('pOS_dailyTodos',dailyTodos);renderDailyTodos()}
}
function deleteDailyTodo(id){
  dailyTodos=dailyTodos.filter(t=>t.id!==id);
  save('pOS_dailyTodos',dailyTodos);
  renderDailyTodos();
}

// ==================== INBOX ====================
function openInbox(){
  const modal=document.getElementById('inboxModal');
  const list=document.getElementById('inboxList');
  const unprocessed=inbox.filter(i=>!i.processed);
  if(unprocessed.length===0){
    list.innerHTML='<div class="inbox-empty">🎉 收件箱已清空</div>';
  }else{
    list.innerHTML=unprocessed.map(i=>`
      <div class="inbox-item">
        <span class="inbox-dot"></span>
        <span class="inbox-text">${escapeHtml(i.text)}</span>
        <span style="font-size:11px;color:var(--text-muted);margin-right:6px">${formatDate(i.date)}</span>
        <div class="inbox-actions">
          <button class="ia-btn ia-process" onclick="processInbox('${i.id}')">转为待办</button>
          <button class="ia-btn ia-archive" onclick="archiveInbox('${i.id}')">归档</button>
        </div>
      </div>
    `).join('');
  }
  modal.style.display='flex';
}
function closeInbox(){document.getElementById('inboxModal').style.display='none'}
function processInbox(id){
  const item=inbox.find(i=>i.id===id);
  if(item){
    dailyTodos.push({id:uuid(),date:TODAY,text:item.text,done:false,createdAt:new Date().toISOString()});
    save('pOS_dailyTodos',dailyTodos);
    item.processed=true;
    save('pOS_inbox',inbox);
    renderDailyTodos();
    renderDashboard();
    openInbox();
    toast('已转为当日待办');
  }
}
function archiveInbox(id){
  const item=inbox.find(i=>i.id===id);
  if(item){item.processed=true;save('pOS_inbox',inbox);renderDashboard();openInbox();toast('已归档')}
}

// ==================== QUICK RECORD ====================
function openQuickRecord(){
  document.getElementById('quickRecordModal').style.display='flex';
  document.getElementById('quickRecordInput').value='';
  setTimeout(()=>document.getElementById('quickRecordInput').focus(),200);
}
function closeQuickRecord(){document.getElementById('quickRecordModal').style.display='none'}
function saveQuickRecord(){
  const text=document.getElementById('quickRecordInput').value.trim();
  if(!text)return;
  inbox.push({id:uuid(),text,date:TODAY,processed:false});
  save('pOS_inbox',inbox);
  renderDashboard();
  closeQuickRecord();
  toast('已保存到收件箱');
}

// ==================== STUDY ====================
function renderStudyTasks(){
  const container=document.getElementById('studyTasks');
  const studyTasks=tasks.filter(t=>t.category==='学习');
  if(studyTasks.length===0){
    container.innerHTML='<div class="todo-empty">暂无学习任务</div>';
    return;
  }
  container.innerHTML=studyTasks.map(t=>`
    <div class="study-task">
      <div class="st-header">
        <span class="st-title">${escapeHtml(t.title)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <label class="st-check">
            <input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}')">
            <span>完成</span>
          </label>
          <button class="edit-task-btn" onclick="openEditTask('${t.id}')">✏️</button>
        </div>
      </div>
      <div class="study-review">
        <div class="sr-label">📝 今日复盘</div>
        <textarea placeholder="记录今天的收获和反思..." onchange="saveTaskReview('${t.id}',this.value)">${escapeHtml(t.review||'')}</textarea>
      </div>
    </div>
  `).join('');
}
function toggleTask(id){
  const t=tasks.find(t=>t.id===id);
  if(t){t.completed=!t.completed;save('pOS_tasks',tasks);renderStudyTasks();renderWorkTasks();renderDashboard()}
}
function saveTaskReview(id,val){
  const t=tasks.find(t=>t.id===id);
  if(t){t.review=val;save('pOS_tasks',tasks)}
}
function showAddStudyTask(){
  const title=prompt('请输入学习任务名称：');
  if(title&&title.trim()){
    tasks.push({id:uuid(),title:title.trim(),category:'学习',completed:false,review:'',editable:true});
    save('pOS_tasks',tasks);
    renderStudyTasks();
    renderDashboard();
  }
}

// ==================== WORK ====================
function renderWorkTasks(){
  const container=document.getElementById('workTasks');
  const workTasks=tasks.filter(t=>t.category==='工作');
  if(workTasks.length===0){
    container.innerHTML='<div class="work-placeholder"><div class="wp-icon">💼</div><p>暂无工作任务</p></div>';
    return;
  }
  container.innerHTML=workTasks.map(t=>`
    <div class="study-task" style="border-left-color:var(--accent-purple);background:var(--accent-purple-light)">
      <div class="st-header">
        <span class="st-title" style="color:var(--accent-purple)">${escapeHtml(t.title)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <label class="st-check">
            <input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}')">
            <span>完成</span>
          </label>
          <button class="edit-task-btn" style="color:var(--accent-purple)" onclick="openEditTask('${t.id}')">✏️</button>
        </div>
      </div>
    </div>
  `).join('');
}
function showAddWorkTask(){
  const title=prompt('请输入工作任务名称：');
  if(title&&title.trim()){
    tasks.push({id:uuid(),title:title.trim(),category:'工作',completed:false,review:'',editable:true});
    save('pOS_tasks',tasks);
    renderWorkTasks();
    renderDashboard();
  }
}

// ==================== EDIT TASK ====================
function openEditTask(id){
  editTaskId=id;
  const t=tasks.find(t=>t.id===id);
  document.getElementById('editTaskInput').value=t?t.title:'';
  document.getElementById('editTaskModal').style.display='flex';
}
function closeEditTask(){document.getElementById('editTaskModal').style.display='none';editTaskId=null}
function saveEditTask(){
  const val=document.getElementById('editTaskInput').value.trim();
  if(!val)return;
  const t=tasks.find(t=>t.id===editTaskId);
  if(t){t.title=val;save('pOS_tasks',tasks);renderStudyTasks();renderWorkTasks();renderDashboard()}
  closeEditTask();
}
function deleteEditTask(){
  if(!confirm('确定删除此任务？'))return;
  tasks=tasks.filter(t=>t.id!==editTaskId);
  save('pOS_tasks',tasks);
  renderStudyTasks();renderWorkTasks();renderDashboard();
  closeEditTask();
  toast('任务已删除');
}

// ==================== LIFE ====================
function loadLifeForm(date){
  const targetDate=date||TODAY;
  currentEditDate=targetDate;
  const d=lifeData[targetDate];
  if(d){
    document.getElementById('lfWeight').value=d.weight||'';
    document.getElementById('lfSteps').value=d.steps||'';
    document.getElementById('lfCalories').value=d.calories||'';
    // Uncheck all exercise checkboxes first
    document.querySelectorAll('.exercise-checkbox').forEach(cb=>cb.checked=false);
    if(d.exercise){
      const items=d.exercise.split(',').map(s=>s.trim());
      items.forEach(item=>{
        const cb=document.querySelector(`.exercise-checkbox[value="${item}"]`);
        if(cb)cb.checked=true;
      });
    }
  }else{
    document.getElementById('lfWeight').value='';
    document.getElementById('lfSteps').value='';
    document.getElementById('lfCalories').value='';
    document.querySelectorAll('.exercise-checkbox').forEach(cb=>cb.checked=false);
  }
}
function saveLifeData(e){
  e.preventDefault();
  const exercises=Array.from(document.querySelectorAll('.exercise-checkbox:checked')).map(cb=>cb.value);
  lifeData[currentEditDate]={
    weight:parseFloat(document.getElementById('lfWeight').value)||0,
    steps:parseInt(document.getElementById('lfSteps').value)||0,
    calories:parseInt(document.getElementById('lfCalories').value)||0,
    exercise:exercises.join(',')
  };
  save('pOS_lifeData',lifeData);
  renderLifeCharts(document.querySelector('#lifeChartTabs .chart-tab.active')?.dataset?.period||'week');
  updateRecommendation();
  renderLifeHistory();
  toast('健康数据已保存');
}

function editLifeData(date){
  loadLifeForm(date);
  document.querySelector('.life-submit').textContent='更新数据';
  toast('已加载 '+date+' 的数据');
}

function renderLifeHistory(){
  const container=document.getElementById('lifeHistory');
  const dates=Object.keys(lifeData).sort().reverse();
  if(dates.length===0){
    container.innerHTML='<div class="period-empty">暂无生活数据</div>';
    return;
  }
  container.innerHTML=dates.map(d=>{
    const data=lifeData[d];
    const exerciseText=data.exercise?data.exercise:'未记录';
    return `<div class="period-record" style="border-left-color:var(--accent-green);background:var(--accent-green-light);cursor:pointer" onclick="editLifeData('${d}')">
      <div class="pr-dates">🏃 ${d}</div>
      <div class="pr-details">
        <span class="pr-tag">体重:${data.weight}kg</span>
        <span class="pr-tag">步数:${data.steps}</span>
        <span class="pr-tag">卡路里:${data.calories}</span>
        <span class="pr-tag">锻炼:${escapeHtml(exerciseText)}</span>
      </div>
    </div>`;
  }).join('');
}

function getDataForPeriod(period){
  const dates=Object.keys(lifeData).sort();
  const now=new Date();
  let start;
  if(period==='week'){start=new Date(now);start.setDate(now.getDate()-6)}
  else if(period==='month'){start=new Date(now.getFullYear(),now.getMonth(),1)}
  else{start=new Date(now.getFullYear(),0,1)}
  const startStr=start.toISOString().split('T')[0];
  return dates.filter(d=>d>=startStr&&d<=TODAY).map(d=>({date:d,...lifeData[d]}));
}

function renderLifeCharts(period){
  const data=getDataForPeriod(period);
  const labels=data.map(d=>formatDate(d.date));
  const steps=data.map(d=>d.steps||0);
  const calories=data.map(d=>d.calories||0);

  const chartOptions={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      y:{beginAtZero:true,grid:{color:'#EBEBEB'},ticks:{font:{size:10},color:'#6B6B6B'}},
      x:{grid:{display:false},ticks:{font:{size:10},color:'#6B6B6B'}}
    }
  };

  // Steps chart
  if(stepsChart)stepsChart.destroy();
  const stepsCtx=document.getElementById('stepsChart').getContext('2d');
  stepsChart=new Chart(stepsCtx,{
    type:'bar',
    data:{
      labels,
      datasets:[{label:'步数',data:steps,backgroundColor:'rgba(59,130,246,0.15)',borderColor:'#3B82F6',borderWidth:1,borderRadius:6}]
    },
    options:{...chartOptions,plugins:{...chartOptions.plugins,title:{display:true,text:'每日步数',color:'#1A1A1A',font:{size:13}}}}
  });

  // Calories chart
  if(caloriesChart)caloriesChart.destroy();
  const calCtx=document.getElementById('caloriesChart').getContext('2d');
  caloriesChart=new Chart(calCtx,{
    type:'bar',
    data:{
      labels,
      datasets:[{label:'卡路里',data:calories,backgroundColor:'rgba(16,185,129,0.15)',borderColor:'#10B981',borderWidth:1,borderRadius:6}]
    },
    options:{...chartOptions,plugins:{...chartOptions.plugins,title:{display:true,text:'每日卡路里消耗 (kcal)',color:'#1A1A1A',font:{size:13}}}}
  });
}

function updateRecommendation(){
  const d=lifeData[TODAY];
  const card=document.getElementById('recommendationCard');
  const content=document.getElementById('recommendationContent');
  if(!d){card.style.display='none';return}
  card.style.display='block';

  let meal='',exercise='';
  const steps=d.steps||0;
  const cals=d.calories||0;

  if(steps<5000){
    meal='🍲 推荐今日餐食：高蛋白低脂餐 - 鸡胸肉沙拉 + 糙米饭 + 蒸西兰花，补充能量同时控制热量';
    exercise='🏋️ 运动建议：今日活动量偏低，建议晚饭后进行30分钟快走或15分钟HIIT训练';
  }else if(steps<10000){
    meal='🥗 推荐今日餐食：均衡营养餐 - 三文鱼 + 藜麦 + 烤蔬菜，优质蛋白搭配复合碳水';
    exercise='🧘 运动建���：今日活动适中，建议做20分钟瑜伽拉伸，帮助肌肉恢复';
  }else{
    meal='🍝 推荐今日餐食：能量补充餐 - 全麦意面 + 牛肉 + 蔬菜汤，补充消耗的碳水';
    exercise='💆 运动建议：今日活动量充足！建议泡沫轴放松 + 10分钟冥想，注意休息';
  }
  if(cals>2500){
    meal+='\n⚠️ 卡路里消耗较高，注意补充水分和电解质';
  }
  content.innerHTML=`<div class="rec-title">今日建议</div>${meal}<br><br>${exercise}`;
}

// ==================== MOOD ====================
const moodLabels={1:'😫 崩溃',2:'😢 难过',3:'😔 低落',4:'😕 疲惫',5:'😐 平静',6:'🙂 还行',7:'😊 愉悦',8:'😄 开心',9:'🤩 兴奋',10:'🥳 超棒'};
const moodColors={1:'#F43F5E',2:'#FB7185',3:'#FDA4AF',4:'#F9A8D4',5:'#E2E8F0',6:'#C4B5FD',7:'#A78BFA',8:'#8B5CF6',9:'#7C3AED',10:'#6D28D9'};

function updateMoodDisplay(){
  const v=parseInt(document.getElementById('moodSlider').value);
  document.getElementById('moodValue').textContent=v;
  document.getElementById('moodEmoji').textContent=moodLabels[v].split(' ')[0];
  document.getElementById('moodLabelText').textContent=moodLabels[v].split(' ').slice(1).join(' ');
}

function saveMood(){
  const v=parseInt(document.getElementById('moodSlider').value);
  const note=document.getElementById('moodNote').value.trim();
  const date=editingMoodDate||TODAY;
  moodData[date]={mood:v,label:moodLabels[v],note};
  save('pOS_moodData',moodData);
  renderMoodChart(document.querySelector('#moodChartTabs .chart-tab.active')?.dataset?.period||'week');
  refreshMoodTips();
  renderMoodHistory();
  editingMoodDate=null;
  document.querySelector('.mood-submit').textContent='记录情绪';
  toast('情绪已记录 💜');
}

function editMood(date){
  const d=moodData[date];
  if(!d)return;
  editingMoodDate=date;
  document.getElementById('moodSlider').value=d.mood;
  document.getElementById('moodNote').value=d.note||'';
  updateMoodDisplay();
  document.querySelector('.mood-submit').textContent='更新情绪';
  toast('已加载 '+date+' 的情绪记录');
}

function renderMoodHistory(){
  const container=document.getElementById('moodHistory');
  const dates=Object.keys(moodData).sort().reverse();
  if(dates.length===0){
    container.innerHTML='<div class="period-empty">暂无情绪记录</div>';
    return;
  }
  container.innerHTML=dates.map(d=>{
    const m=moodData[d];
    const emoji=m.label?m.label.split(' ')[0]:'😐';
    const labelText=m.label?m.label.split(' ').slice(1).join(' '):'';
    return `<div class="period-record" style="border-left-color:var(--accent-pink);background:var(--accent-pink-light)">
      <span class="pr-del" onclick="deleteMood('${d}')">×</span>
      <div class="pr-dates" onclick="editMood('${d}')" style="cursor:pointer">${emoji} ${d} - ${labelText} (${m.mood}/10)</div>
      ${m.note?`<div class="pr-details"><span class="pr-tag">${escapeHtml(m.note)}</span></div>`:''}
    </div>`;
  }).join('');
}

function deleteMood(date){
  if(!confirm('确定删除此情绪记录？'))return;
  delete moodData[date];
  save('pOS_moodData',moodData);
  renderMoodHistory();
  renderMoodChart(document.querySelector('#moodChartTabs .chart-tab.active')?.dataset?.period||'week');
  toast('记录已删除');
}

function getMoodDataForPeriod(period){
  const dates=Object.keys(moodData).sort();
  const now=new Date();
  let start;
  if(period==='week'){start=new Date(now);start.setDate(now.getDate()-6)}
  else if(period==='month'){start=new Date(now.getFullYear(),now.getMonth(),1)}
  else{start=new Date(now.getFullYear(),0,1)}
  const startStr=start.toISOString().split('T')[0];
  return dates.filter(d=>d>=startStr&&d<=TODAY).map(d=>({date:d,...moodData[d]}));
}

function renderMoodChart(period){
  const data=getMoodDataForPeriod(period);
  const labels=data.map(d=>formatDate(d.date));
  const values=data.map(d=>d.mood||0);
  const bgColors=values.map(v=>moodColors[v]||'#CAA0A5');

  if(moodChart)moodChart.destroy();
  const ctx=document.getElementById('moodChart').getContext('2d');
  moodChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'情绪指数',data:values,
        borderColor:'#8B5CF6',backgroundColor:'rgba(139,92,246,0.08)',
        borderWidth:2.5,tension:0.4,fill:true,
        pointBackgroundColor:bgColors,pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:6,pointHoverRadius:8
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},title:{display:true,text:'情绪趋势',color:'#1A1A1A',font:{size:13}}},
      scales:{
        y:{min:0,max:11,ticks:{stepSize:1,color:'#6B6B6B',font:{size:10},callback:v=>v>0&&v<11?moodLabels[v]?.split(' ')[0]:''},grid:{color:'#EBEBEB'}},
        x:{grid:{display:false},ticks:{font:{size:10},color:'#6B6B6B'}}
      }
    }
  });
}

// ==================== PERIOD ====================
function savePeriod(e){
  e.preventDefault();
  const record={
    startDate:document.getElementById('pfStart').value,
    endDate:document.getElementById('pfEnd').value,
    pain:document.getElementById('pfPain').checked,
    vomit:document.getElementById('pfVomit').checked,
    diarrhea:document.getElementById('pfDiarrhea').checked,
    flowEarly:document.getElementById('pfFlowEarly').value,
    flowLate:document.getElementById('pfFlowLate').value
  };
  if(editPeriodId){
    const idx=periodData.findIndex(p=>p.id===editPeriodId);
    if(idx>=0){record.id=editPeriodId;periodData[idx]=record}
    editPeriodId=null;
    document.querySelector('.period-submit').textContent='保存记录';
  }else{
    record.id=uuid();
    periodData.push(record);
  }
  periodData.sort((a,b)=>b.startDate.localeCompare(a.startDate));
  save('pOS_periodData',periodData);
  renderPeriodHistory();
  document.getElementById('periodForm').reset();
  toast('经期记录已保存');
}

function editPeriod(id){
  const p=periodData.find(p=>p.id===id);
  if(!p)return;
  editPeriodId=id;
  document.getElementById('pfStart').value=p.startDate||'';
  document.getElementById('pfEnd').value=p.endDate||'';
  document.getElementById('pfPain').checked=p.pain||false;
  document.getElementById('pfVomit').checked=p.vomit||false;
  document.getElementById('pfDiarrhea').checked=p.diarrhea||false;
  document.getElementById('pfFlowEarly').value=p.flowEarly||'中等';
  document.getElementById('pfFlowLate').value=p.flowLate||'中等';
  document.querySelector('.period-submit').textContent='更新记录';
  toast('已加载经期记录，可编辑后保存');
}

function renderPeriodHistory(){
  const container=document.getElementById('periodHistory');
  if(periodData.length===0){
    container.innerHTML='<div class="period-empty">暂无经期记录</div>';
    return;
  }
  container.innerHTML=periodData.map(p=>{
    const tags=[];
    if(p.pain)tags.push('疼痛');
    if(p.vomit)tags.push('呕吐');
    if(p.diarrhea)tags.push('拉肚子');
    if(p.flowEarly||p.flowLate){
      tags.push(`前期:${p.flowEarly||'-'}`);
      tags.push(`后期:${p.flowLate||'-'}`);
    }
    if(p.flow)tags.push(`血量:${p.flow}`);
    const duration=Math.ceil((new Date(p.endDate)-new Date(p.startDate))/(86400000))+1;
    return `<div class="period-record">
      <span class="pr-del" onclick="deletePeriod('${p.id}')">×</span>
      <button class="edit-task-btn" style="float:right;color:var(--accent-coral);margin-right:8px" onclick="editPeriod('${p.id}')">编辑</button>
      <div class="pr-dates">📅 ${p.startDate} ~ ${p.endDate} (${duration}天)</div>
      <div class="pr-details">${tags.map(t=>`<span class="pr-tag">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
}
function deletePeriod(id){
  if(!confirm('确定删除此记录？'))return;
  periodData=periodData.filter(p=>p.id!==id);
  save('pOS_periodData',periodData);
  renderPeriodHistory();
  toast('记录已删除');
}

// ==================== CHART TABS ====================
function initChartTabs(){
  document.querySelectorAll('.chart-tabs').forEach(tabs=>{
    tabs.querySelectorAll('.chart-tab').forEach(tab=>{
      tab.addEventListener('click',function(){
        this.parentElement.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
        this.classList.add('active');
        const period=this.dataset.period;
        if(this.closest('#lifeChartTabs'))renderLifeCharts(period);
        if(this.closest('#moodChartTabs'))renderMoodChart(period);
      });
    });
  });
}
